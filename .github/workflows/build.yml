name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Build (Debug)
        run: make build

      - name: Test
        run: make test

      - name: Build Release + package .dmg
        run: make dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SamsungRemote-dmg
          path: build/SamsungRemote.dmg

      # Só em push de tag (ex.: v0.1.0): publica o .dmg como GitHub Release.
      - name: Rename .dmg with version
        if: startsWith(github.ref, 'refs/tags/')
        run: cp build/SamsungRemote.dmg "build/SamsungRemote-${{ github.ref_name }}.dmg"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/SamsungRemote-${{ github.ref_name }}.dmg
          generate_release_notes: true
